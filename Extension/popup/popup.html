<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <h1>Tab Collection</h1>
    <div id="tabs-section">
      <h2>Current Tabs</h2>
      <div id="tab-list"></div>
    </div>
    <div id="actions">
      <button id="add-to-group-btn" disabled>Add to Group</button>
      <select id="group-select">
        <option value="">Select group...</option>
      </select>
    </div>
    <div id="new-group-form" style="display:none">
      <input type="text" id="new-group-name" placeholder="Group name">
      <div id="new-group-icons"></div>
      <div id="new-group-colors"></div>
      <div class="form-actions">
        <button id="create-group-cancel">Cancel</button>
        <button id="create-group-confirm">Create</button>
      </div>
    </div>
    <div id="bottom-actions">
      <button id="manage-groups-btn">Manage Groups</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/reset.css">
  <link rel="stylesheet" href="../styles/glass.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/animations.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div id="app" class="app">
    <header class="app-header glass-strong">
      <h1 id="app-title" class="app-title">Tab Collections</h1>
      <input type="search" id="search-input" class="search-input" placeholder="🔍 Search collections and tabs...">
      <div class="header-actions">
        <button id="view-toggle-btn" class="btn-ghost" title="Switch to List"><span class="btn-icon">▦</span><span class="btn-label">Grid view</span></button>
        <button id="header-help-btn" class="btn-ghost" title="Help" style="font-size:16px">❓</button>
      </div>
    </header>

    <div id="status-bar" class="status-bar glass-card"></div>

    <div id="groups-view">
      <div id="groups-grid" class="groups-grid animate-stagger"></div>
      <div id="empty-state" class="empty-state" style="display:none">
        <p>No collections yet. Click <b>＋ New Collection</b> card below to start, or open the FAB (<b>⚙</b>) → <b>❓</b> for help.</p>
      </div>
    </div>
  </div>

  <div id="fab" class="fab">
    <div id="fab-menu" class="fab-menu">
      <button id="fab-export" class="fab-item" title="Export"><span class="fab-label">Export</span><span class="btn-icon">📤</span></button>
      <button id="fab-import" class="fab-item" title="Import"><span class="fab-label">Import</span><span class="btn-icon">📥</span></button>
      <button id="fab-customize" class="fab-item" title="Customize"><span class="fab-label">Customize</span><span class="btn-icon">🎨</span></button>
      <button id="fab-theme" class="fab-item" title="Theme: System"><span class="fab-label">Theme: System</span><span class="btn-icon">💻</span></button>
      <button id="fab-privacy" class="fab-item" title="Privacy"><span class="fab-label">Privacy</span><span class="btn-icon">👁</span></button>
      <button id="fab-help" class="fab-item" title="Help"><span class="fab-label">Help</span><span class="btn-icon">❓</span></button>
    </div>
    <button id="fab-toggle" class="fab-toggle">⚙</button>
  </div>

  <input type="file" id="import-input" accept=".json" style="display:none">

  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div id="modal" class="modal">
      <h2 id="modal-title">New Collection</h2>
      <label for="group-name-input">Name <span class="required">*</span></label>
      <input type="text" id="group-name-input" class="modal-input" placeholder="Collection name">
      <span id="name-error" class="name-error">Name is required</span>
      <label>Icon</label>
      <div id="icon-picker" class="icon-picker"></div>
      <label>Color</label>
      <div id="color-picker" class="color-picker"></div>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="btn-ghost">Cancel</button>
        <button id="modal-confirm-btn" class="btn-primary">Create</button>
      </div>
    </div>
  </div>

  <div id="bg-modal-overlay" class="modal-overlay" style="display:none">
    <div id="bg-modal" class="modal" style="width:500px">
      <h2>Customize Background</h2>
      <label>Presets</label>
      <div id="bg-presets" class="bg-presets"></div>
      <div id="bg-drop-zone" class="bg-drop-zone">
        <span>Drop image here</span>
      </div>
      <label>Or paste image URL</label>
      <input type="text" id="bg-url-input" class="modal-input" placeholder="https://...">
      <div class="modal-actions">
        <button id="bg-cancel-btn" class="btn-ghost">Cancel</button>
        <button id="bg-remove-btn" class="btn-danger">Remove Background</button>
        <button id="bg-confirm-btn" class="btn-primary">Apply</button>
      </div>
    </div>
  </div>

  <div id="confirm-overlay" class="modal-overlay" style="display:none">
    <div id="confirm-modal" class="modal">
      <p id="confirm-message" class="confirm-message"></p>
      <div class="modal-actions">
        <button id="confirm-cancel-btn" class="btn-ghost">Cancel</button>
        <button id="confirm-ok-btn" class="btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <div id="icon-popover" class="icon-popover" style="display:none">
    <input type="text" class="icon-search" id="popover-icon-search" placeholder="Search icons...">
    <div class="icon-grid-scroll"></div>
  </div>

  <div id="tab-picker-overlay" class="modal-overlay" style="display:none">
    <div id="tab-picker-modal" class="modal" style="width:420px;max-height:80vh;display:flex;flex-direction:column">
      <h2>Select tabs to add</h2>
      <div id="tab-picker-list" class="tab-picker-list"></div>
      <div class="modal-actions" style="margin-top:12px;border-top:1px solid var(--border-color);padding-top:12px">
        <button id="tab-picker-cancel-btn" class="btn-ghost">Cancel</button>
        <button id="tab-picker-add-btn" class="btn-primary">Add Selected</button>
      </div>
    </div>
  </div>

  <div id="help-overlay" class="modal-overlay" style="display:none">
    <div id="help-modal" class="modal" style="width:640px;max-height:85vh;display:flex;flex-direction:column">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 style="margin:0">❓ Help & Guide</h2>
        <button id="help-close-btn" class="btn-ghost" style="font-size:18px;padding:4px 10px">✕</button>
      </div>
      <div id="help-content" class="help-content"></div>
    </div>
  </div>

  <script src="../constants.js"></script>
  <script src="newtab.js"></script>
</body>
</html>

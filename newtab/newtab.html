<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Tab Collections</h1>
      <div class="header-actions">
        <button id="new-group-btn">+ New Collection</button>
        <button id="export-btn">Export</button>
        <button id="import-btn">Import</button>
        <button id="customize-btn">🎨</button>
        <input type="file" id="import-input" accept=".json" style="display:none">
      </div>
    </header>

    <div id="status-bar"></div>

    <div id="groups-view">
      <div id="groups-grid"></div>
      <div id="empty-state" style="display:none">
        <p>No collections yet. Use the extension popup to add tabs, or click "+ New Collection" to start.</p>
      </div>
    </div>
  </div>

  <div id="modal-overlay" style="display:none">
    <div id="modal">
      <h2 id="modal-title">New Collection</h2>
      <label for="group-name-input">Name <span class="required">*</span></label>
      <input type="text" id="group-name-input" placeholder="Collection name">
      <span id="name-error">Name is required</span>
      <label>Icon</label>
      <div id="icon-picker"></div>
      <label>Color</label>
      <div id="color-picker"></div>
      <div class="modal-actions">
        <button id="modal-cancel-btn">Cancel</button>
        <button id="modal-confirm-btn">Create</button>
      </div>
    </div>
  </div>

  <div id="bg-modal-overlay" style="display:none">
    <div id="bg-modal">
      <h2>Customize Background</h2>
      <label>Presets</label>
      <div id="bg-presets"></div>
      <div id="bg-drop-zone">
        <span>Drop image here</span>
      </div>
      <label>Or paste image URL</label>
      <input type="text" id="bg-url-input" placeholder="https://...">
      <div class="modal-actions">
        <button id="bg-cancel-btn">Cancel</button>
        <button id="bg-remove-btn">Remove Background</button>
        <button id="bg-confirm-btn">Apply</button>
      </div>
    </div>
  </div>

  <div id="confirm-overlay" style="display:none">
    <div id="confirm-modal">
      <p id="confirm-message"></p>
      <div class="modal-actions">
        <button id="confirm-cancel-btn">Cancel</button>
        <button id="confirm-ok-btn">Delete</button>
      </div>
    </div>
  </div>

  <div id="icon-popover" style="display:none">
    <input type="text" class="icon-search" id="popover-icon-search" placeholder="🔍 Search icons...">
    <div class="icon-grid-scroll"></div>
  </div>

  <script src="../constants.js"></script>
  <script src="newtab.js"></script>
</body>
</html>

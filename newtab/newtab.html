<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/reset.css">
  <link rel="stylesheet" href="../styles/glass.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/animations.css">
  <link rel="stylesheet" href="../styles/responsive.css">
  <link rel="stylesheet" href="newtab.css">
  <link rel="stylesheet" href="../styles/themes/glass.css">
  <link rel="stylesheet" href="../styles/themes/minimal.css">
  <link rel="stylesheet" href="../styles/themes/material.css">
  <link rel="stylesheet" href="../styles/themes/neubrutalism.css">
  <link rel="stylesheet" href="../styles/themes/dark-premium.css">
  <link rel="stylesheet" href="../styles/themes/macos.css">
  <link rel="stylesheet" href="../styles/themes/terminal.css">
</head>
<body>
  <div id="app" class="app">
    <aside id="app-sidebar" class="app-sidebar" aria-label="Collections">
      <h1 id="app-title" class="app-title">Tab Collections</h1>
      <div class="sidebar-label">COLLECTIONS</div>
      <nav id="sidebar-list" class="sidebar-list"></nav>
      <button id="new-group-btn" class="sidebar-item sidebar-new"><span class="btn-icon" data-icon="plus"></span><span class="sidebar-item-name">Collection mới</span></button>
      <div class="sidebar-spacer"></div>
      <div class="settings-wrap">
        <div id="settings-menu" class="settings-menu" role="menu" hidden>
          <button id="settings-customize" class="settings-item" role="menuitem"><span class="btn-icon" data-icon="palette"></span><span>Hình nền &amp; Theme</span></button>
          <button id="settings-theme" class="settings-item" role="menuitem" data-keep-open><span class="btn-icon" data-icon="monitor"></span><span class="settings-label">Sáng / Tối: Hệ thống</span></button>
          <button id="settings-privacy" class="settings-item" role="menuitem" data-keep-open><span class="btn-icon" data-icon="eye"></span><span>Chế độ riêng tư</span></button>
          <hr class="settings-sep">
          <button id="settings-export" class="settings-item" role="menuitem"><span class="btn-icon" data-icon="upload"></span><span>Export</span></button>
          <button id="settings-import" class="settings-item" role="menuitem"><span class="btn-icon" data-icon="download"></span><span>Import</span></button>
          <button id="settings-help" class="settings-item" role="menuitem"><span class="btn-icon" data-icon="helpCircle"></span><span>Hướng dẫn</span></button>
        </div>
        <button id="settings-btn" class="sidebar-item" aria-haspopup="menu" aria-expanded="false"><span class="btn-icon" data-icon="gear"></span><span class="sidebar-item-name">Cài đặt</span></button>
      </div>
    </aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <header class="app-header">
      <button id="sidebar-open-btn" class="sidebar-open-btn" aria-label="Mở danh sách collection"><span class="btn-icon" data-icon="menu"></span></button>
      <span id="today-label" class="today-label"></span>
      <div class="nav-tabs">
        <button class="nav-tab active" data-view="collections">📂 Collections</button>
        <button class="nav-tab" data-view="tasks">📋 Tasks</button>
      </div>
      <label class="search-wrap">
        <span class="btn-icon" data-icon="search"></span>
        <input type="search" id="search-input" class="search-input" placeholder="Tìm tab, collection…" aria-label="Tìm tab, collection">
        <kbd id="search-kbd" class="search-kbd"></kbd>
      </label>
      <div class="header-actions" id="collections-header-actions">
        <div class="view-seg" role="group" aria-label="Kiểu hiển thị">
          <button id="view-tiles-btn" class="view-seg-btn" title="Dạng ô" aria-pressed="true"><span class="btn-icon" data-icon="grid"></span></button>
          <button id="view-rows-btn" class="view-seg-btn" title="Dạng dòng" aria-pressed="false"><span class="btn-icon" data-icon="list"></span></button>
        </div>
      </div>
      <div id="tasks-header-actions" class="tasks-header-actions" style="display:none">
        <div class="tasks-search-wrap">
          <span class="tasks-search-icon">🔍</span>
          <input type="search" id="tasks-search" class="tasks-search-input"
                 placeholder="Task hôm nay — Tìm tiêu đề, ghi chú..."
                 aria-label="Tìm task">
        </div>
        <select id="tasks-pic-filter" class="tasks-filter" aria-label="Lọc theo người phụ trách">
          <option value="all">👤 Tất cả</option>
          <option value="tuong">Tường</option>
          <option value="dung">Dung</option>
          <option value="phuoc">Phước</option>
          <option value="tran">Trân</option>
          <option value="cuong">Cường</option>
          <option value="hao">Hào</option>
        </select>
        <select id="tasks-range-filter" class="tasks-filter" aria-label="Phạm vi thời gian">
          <option value="today">📅 H.nay</option>
          <option value="week">📅 7 ngày</option>
          <option value="all">📅 T.cả</option>
        </select>
        <select id="tasks-type-filter" class="tasks-filter" aria-label="Lọc theo loại">
          <option value="all">📋 T.cả</option>
          <option value="task">📋 Task</option>
          <option value="release">🚀 Release</option>
        </select>
        <select id="tasks-status-filter" class="tasks-filter" aria-label="Lọc theo trạng thái">
          <option value="todo">⬜ Chưa xong</option>
          <option value="done">✅ Xong</option>
          <option value="all">⬜ T.cả</option>
        </select>
        <select id="tasks-prio-filter" class="tasks-filter" aria-label="Lọc theo mức ưu tiên">
          <option value="all">🔴 T.cả</option>
          <option value="high">🔴 Cao</option>
          <option value="normal">🔵 Vừa</option>
          <option value="low">🟢 Thấp</option>
        </select>
        <button id="tasks-reset-filters" class="btn-ghost tasks-reset-btn" style="display:none" title="Xoá bộ lọc">✕</button>
        <button id="tasks-refresh-btn" class="tasks-icon-btn" title="Tải lại">⟳</button>
        <span id="tasks-board-link" class="tasks-icon-btn" title="Mở board đầy đủ">📊</span>
      </div>
    </header>

    <main class="app-main" role="main">
      <div id="status-bar" class="status-bar glass-card"></div>
      <div id="collections-view">
        <div id="groups-view">
          <div id="groups-grid" class="groups-grid"></div>
          <div id="empty-state" class="empty-state" style="display:none"></div>
        </div>
      </div>
    <div id="tasks-view" style="display:none">
      <div id="tasks-login-gate" style="display:none">
        <div class="tasks-login-card">
          <div class="tasks-login-icon">🔐</div>
          <h2>Đăng nhập để xem công việc</h2>
          <p class="subtitle">Kết nối với tài khoản Lịch Công Việc để xem và quản lý tasks</p>
          <button id="tasks-login-btn" class="btn-primary tasks-login-btn">Đăng nhập</button>
        </div>
      </div>
      <div id="tasks-content" style="display:none">
        <div id="tasks-error" class="tasks-error" style="display:none"></div>
        <div id="tasks-list"></div>
      </div>
    </div>
    </main>
  </div>

  <input type="file" id="import-input" accept=".json" style="display:none">

  <div id="modal-overlay" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal" class="modal">
      <h2 id="modal-title">New Collection</h2>
      <label for="group-name-input">Name <span class="required">*</span></label>
      <input type="text" id="group-name-input" class="modal-input" placeholder="Collection name">
      <span id="name-error" class="name-error">Name is required</span>
      <label>Icon</label>
      <div id="icon-picker" class="icon-picker"></div>
      <label>Color</label>
      <div id="color-picker" class="color-picker"></div>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="btn-ghost">Cancel</button>
        <button id="modal-confirm-btn" class="btn-primary">Create</button>
      </div>
    </div>
  </div>

  <div id="bg-modal-overlay" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="bg-modal-title">
    <div id="bg-modal" class="modal">
      <h2 id="bg-modal-title">Customize Background</h2>
      <label>Presets</label>
      <div id="bg-presets" class="bg-presets"></div>
      <div id="bg-drop-zone" class="bg-drop-zone">
        <span>Drop image here</span>
      </div>
      <label>Or paste image URL</label>
      <input type="text" id="bg-url-input" class="modal-input" placeholder="https://...">
      <div class="modal-actions">
        <button id="bg-cancel-btn" class="btn-ghost">Cancel</button>
        <button id="bg-remove-btn" class="btn-danger">Remove Background</button>
        <button id="bg-confirm-btn" class="btn-primary">Apply</button>
      </div>
      <hr style="margin:16px 0;border:none;border-top:1px solid var(--border-color)">
      <h3 style="margin:0 0 10px;font-size:15px;color:var(--text-primary)">🎨 UI Theme</h3>
      <div id="theme-grid" class="theme-grid"></div>
    </div>
  </div>

  <div id="tab-picker-overlay" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="tab-picker-title">
    <div id="tab-picker-modal" class="modal" style="width:420px;max-height:80vh;display:flex;flex-direction:column">
      <h2 id="tab-picker-title">Select tabs to add</h2>
      <div id="tab-picker-list" class="tab-picker-list"></div>
      <div class="modal-actions" style="margin-top:12px;border-top:1px solid var(--border-color);padding-top:12px">
        <button id="tab-picker-cancel-btn" class="btn-ghost">Cancel</button>
        <button id="tab-picker-add-btn" class="btn-primary">Add Selected</button>
      </div>
    </div>
  </div>

  <div id="help-overlay" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="help-modal-title">
    <div id="help-modal" class="modal" style="width:640px;max-height:85vh;display:flex;flex-direction:column">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 id="help-modal-title" style="margin:0">Help & Guide</h2>
        <button id="help-close-btn" class="btn-ghost" style="padding:4px 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div id="help-content" class="help-content"></div>
    </div>
  </div>

  <div id="tab-edit-overlay" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="tab-edit-title">
    <div id="tab-edit-modal" class="modal" style="width:400px">
      <h2 id="tab-edit-title">Edit Tab</h2>
      <label for="tab-edit-title-input">Title</label>
      <input type="text" id="tab-edit-title-input" class="modal-input">
      <label for="tab-edit-url-input" style="margin-top:10px">URL</label>
      <input type="text" id="tab-edit-url-input" class="modal-input">
      <div class="modal-actions">
        <button id="tab-edit-cancel-btn" class="btn-ghost">Cancel</button>
        <button id="tab-edit-save-btn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <div id="task-modal-overlay" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
    <div id="task-modal" class="modal" style="width:450px">
      <h2 id="task-modal-title">Thêm công việc</h2>
      <div id="task-modal-body">
        <label>Tiêu đề *</label>
        <input type="text" id="task-title-input" class="modal-input" maxlength="200" placeholder="Việc cần làm...">

        <label>Ghi chú</label>
        <textarea id="task-note-input" class="modal-textarea" maxlength="1000" placeholder="Mô tả thêm (tuỳ chọn)"></textarea>

        <div class="task-modal-row">
          <label class="task-switch-label">
            <input type="checkbox" id="task-sticky-input">
            <span class="task-switch"></span>
            <span>📌 Thường trực</span>
          </label>
        </div>

        <div id="task-date-fields">
          <div class="task-modal-row">
            <label class="task-switch-label">
              <input type="checkbox" id="task-allday-input">
              <span class="task-switch"></span>
              <span>Cả ngày</span>
            </label>
          </div>
          <div class="task-modal-grid">
            <div><label>Bắt đầu</label><input type="datetime-local" id="task-start-input" class="modal-input"></div>
            <div><label>Kết thúc / Hạn</label><input type="datetime-local" id="task-due-input" class="modal-input"></div>
          </div>
        </div>

        <label>Mức ưu tiên</label>
        <div id="task-priority-group" class="task-prio-group">
          <label class="task-prio-option active" data-prio="low"><input type="radio" name="task-prio" value="low"> 🟢 Thấp</label>
          <label class="task-prio-option" data-prio="normal"><input type="radio" name="task-prio" value="normal" checked> 🔵 Vừa</label>
          <label class="task-prio-option" data-prio="high"><input type="radio" name="task-prio" value="high"> 🔴 Cao</label>
        </div>

        <label>Người phụ trách (PIC)</label>
        <div id="task-pic-group" class="task-pic-group">
          <button type="button" class="task-pic-chip" data-pic="tuong">Tường</button>
          <button type="button" class="task-pic-chip" data-pic="dung">Dung</button>
          <button type="button" class="task-pic-chip" data-pic="phuoc">Phước</button>
          <button type="button" class="task-pic-chip" data-pic="tran">Trân</button>
          <button type="button" class="task-pic-chip" data-pic="cuong">Cường</button>
          <button type="button" class="task-pic-chip" data-pic="hao">Hào</button>
          <button type="button" class="task-pic-chip" data-pic="__team">👥 Cả team</button>
        </div>

        <div id="task-modal-error" class="task-modal-error"></div>
      </div>
      <div class="modal-actions" id="task-modal-actions">
        <button id="task-modal-cancel-btn" class="btn-ghost">Huỷ</button>
        <span class="spacer"></span>
        <button id="task-modal-delete-btn" class="btn-danger" style="display:none">Xoá</button>
        <button id="task-modal-done-btn" class="btn-ok" style="display:none">✓ Hoàn thành</button>
        <button id="task-modal-save-btn" class="btn-primary">Lưu</button>
      </div>
    </div>
  </div>

  <div id="confirm-overlay" class="modal-overlay" style="display:none" role="alertdialog" aria-modal="true" aria-labelledby="confirm-message">
    <div id="confirm-modal" class="modal">
      <p id="confirm-message" class="confirm-message"></p>
      <div class="modal-actions">
        <button id="confirm-cancel-btn" class="btn-ghost">Huỷ</button>
        <button id="confirm-ok-btn" class="btn-danger">Xoá</button>
      </div>
    </div>
  </div>

  <script src="../constants.js"></script>
  <script src="../icons.js"></script>
  <script src="../tasks/tasks-logic.js"></script>
  <script src="newtab-view.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
